name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile

      - name: Biome
        run: bun run lint:check

      - name: Types
        run: bun run types:check

      - name: Tests
        run: bun run test

      - name: registry.json is up to date and valid
        run: bun run registry:check

      - name: registry.json is pinned to this tag
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: bun scripts/build-registry.ts --check --ref "${{ github.ref_name }}"

      - name: Tag installs from GitHub
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: bunx shadcn registry validate "${{ github.repository }}#${{ github.ref_name }}"
